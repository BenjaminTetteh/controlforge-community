{% extends "base.html" %}

{% block title %}
Login
{% endblock %}

{% block content %}

<h2>Login</h2>

<p>
    Select a demo user to access the ControlForge Enterprise dashboard.
</p>

<form method="post">

    <input
        type="hidden"
        name="csrf_token"
        value="{{ csrf_token() }}"
    >

    <label for="username">
        Demo User
    </label>

    <select name="username" id="username">
        <option value="auditor">Auditor</option>
        <option value="manager">Manager</option>
        <option value="viewer">Viewer</option>
    </select>

    <button type="submit">
        Login
    </button>

</form>

{% endblock %}
