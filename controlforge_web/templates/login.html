{% extends "base.html" %}

{% block title %}
Login
{% endblock %}

{% block content %}

<h2>Login</h2>

<p>
    Sign in to access the ControlForge Enterprise dashboard.
</p>

{% if error %}
<p style="color: red;">
    {{ error }}
</p>
{% endif %}

<form method="post">

    <input
        type="hidden"
        name="csrf_token"
        value="{{ csrf_token() }}"
    >

    <label for="username">
        Username
    </label>

    <input
        type="text"
        id="username"
        name="username"
        required
    >

    <br><br>

    <label for="password">
        Password
    </label>

    <input
        type="password"
        id="password"
        name="password"
        required
    >

    <br><br>

    <button type="submit">
        Login
    </button>

</form>

{% endblock %}
